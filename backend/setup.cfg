[isort]
profile = black
known_django = django
known_third_party = rest_framework,groq,httpx,polyline
sections = FUTURE,STDLIB,DJANGO,THIRD_PARTY,FIRST_PARTY,LOCALFOLDER

[flake8]
max-line-length = 99
extend-ignore = E203, W503
exclude = .git,__pycache__,*/migrations/*

[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
